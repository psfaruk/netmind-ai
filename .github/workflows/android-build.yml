name: android-build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build NETMIND Node APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship a preinstalled Android SDK at ANDROID_HOME
      # (setup-android@v3 currently breaks on cmdline-tools 16.0 / 'tools' pkg).
      - name: Install SDK components (platform, NDK, CMake)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Fetch pinned llama.cpp source
        run: bash scripts/fetch-llama.sh android/lib/src/main/cpp/llama.cpp

      - name: Build release APK
        run: |
          cd android
          bash ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "NETMIND-Node-${{ github.ref_name }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NETMIND-Node-APK
          path: NETMIND-Node-*.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NETMIND-Node-*.apk
          generate_release_notes: true
          prerelease: true
          body: |
            NETMIND Node — offline, on-device AI app.

            - Install the APK on your Android phone (arm64-v8a; x86_64 also included for emulators).
            - On first run, download the open-weight model (~400 MB) once from inside the app.
            - After that, everything runs offline: no server, no vendor model API, no telemetry.

            Requires Android 9+ (API 28) and ~2 GB free RAM for the default 0.6B model.
